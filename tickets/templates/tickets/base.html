<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tickets{% endblock %} - Geller Tickets</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">

    <style>
        body { overflow: hidden; }
        .navbar-brand { font-weight: bold; }

        .dashboard-layout {
            display: flex;
            height: calc(100vh - 56px);
        }
        .ticket-list-panel {
            width: 30%;
            border-right: 1px solid #dee2e6;
            overflow-y: auto;
            flex-shrink: 0;
            background: #fff;
        }
        .ticket-thread-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .thread-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: #f8f9fa;
        }
        .thread-footer {
            border-top: 1px solid #dee2e6;
            padding: 12px;
            background: #fff;
        }
        .ticket-list-item {
            display: block;
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
            text-decoration: none;
            color: inherit;
            transition: background 0.1s;
        }
        .ticket-list-item:hover { background: #f0f4ff; color: inherit; }
        .ticket-list-item.active { background: #e8f0fe; border-left: 3px solid #0d6efd; }
        .ticket-list-item .subject-preview {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .message-bubble {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 18px;
            margin: 4px 0;
            word-wrap: break-word;
        }
        .message-self {
            background: #0d6efd;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .message-other {
            background: #e9ecef;
            color: #212529;
            border-bottom-left-radius: 4px;
        }
        .message-meta {
            font-size: 0.75rem;
            opacity: 0.7;
            margin-top: 2px;
        }
        .message-image img {
            max-width: 300px;
            border-radius: 12px;
            margin: 4px 0;
            cursor: pointer;
        }
        .filter-panel {
            padding: 8px;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
        }
        .filter-panel select {
            font-size: 0.8rem;
        }
        .thread-header {
            padding: 12px 16px;
            border-bottom: 1px solid #dee2e6;
            background: #fff;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'tickets:ticket_dashboard' %}">
                <i class="bi bi-chat-left-text"></i> Geller Tickets
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'tickets:ticket_dashboard' %}">
                            <i class="bi bi-inbox"></i> Dashboard
                        </a>
                    </li>
                </ul>

                <ul class="navbar-nav">
                    {% if user.is_authenticated %}
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown">
                                <i class="bi bi-person-circle"></i> {{ user.username }}
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><a class="dropdown-item" href="/admin/">Admin</a></li>
                                <li><a class="dropdown-item" href="/reports/">Reports</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item" href="/admin/logout/">Logout</a></li>
                            </ul>
                        </li>
                    {% else %}
                        <li class="nav-item">
                            <a class="nav-link" href="/admin/login/?next=/tickets/dashboard/">Login</a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
